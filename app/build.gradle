plugins { id 'com.android.application' }

def stableKeyPath = System.getenv('STRA_SIGNING_KEYSTORE_PATH')
def stableStorePassword = System.getenv('STRA_SIGNING_KEYSTORE_PASSWORD')
def stableKeyPassword = System.getenv('STRA_SIGNING_KEY_PASSWORD')
def stableKeyAlias = System.getenv('STRA_SIGNING_KEY_ALIAS') ?: 'stra-release'

android {
    namespace 'cn.stra.ace5pro.autoclicker'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.stra.autoclicker'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 22
        versionName '2.27-ace5pro'
    }

    buildTypes {
        debug {
            // Uses the stable release key in CI when configured; otherwise Gradle's debug key.
        }
        release {
            minifyEnabled false
            // Configure your own signingConfig before publishing a release build.
        }
    }
}

if (stableKeyPath && stableStorePassword && stableKeyPassword) {
    android.signingConfigs.create('stableRelease') {
        storeFile file(stableKeyPath)
        storePassword stableStorePassword
        keyAlias stableKeyAlias
        keyPassword stableKeyPassword
    }
    android.buildTypes.getByName('debug').signingConfig =
            android.signingConfigs.getByName('stableRelease')
    android.buildTypes.getByName('release').signingConfig =
            android.signingConfigs.getByName('stableRelease')
}


dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
