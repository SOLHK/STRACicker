name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android SDK
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null || true
      - name: Build ARM64 uinput helper
        run: |
          mkdir -p app/src/main/res/raw
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"             -O3 -fPIE -pie -s             native/stra_touch.c             -o app/src/main/res/raw/stra_touch_arm64
      - name: Check stable signing key
        id: signing-key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.STRA_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import stable signing key
        if: steps.signing-key.outputs.configured == 'true'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.STRA_SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/stra-release.jks"
      - name: Build APK
        id: build-apk
        env:
          STRA_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/stra-release.jks
          STRA_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.STRA_SIGNING_KEYSTORE_PASSWORD }}
          STRA_SIGNING_KEY_PASSWORD: ${{ secrets.STRA_SIGNING_KEYSTORE_PASSWORD }}
          STRA_SIGNING_KEY_ALIAS: stra-release
        run: |
          if [ -s "$STRA_SIGNING_KEYSTORE_PATH" ]; then
            gradle :app:assembleRelease --stacktrace
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            gradle :app:assembleDebug --stacktrace
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: STRACicker-v2.1.0-apk
          path: ${{ steps.build-apk.outputs.apk_path }}

